        Essaouira\",\"metaDescription\":\"Appartement lumineux de 92 m2 au
        centre ville, 2 chambres, balcon et ascenseur.\"},\"body\":\"## Visite
        guidee\\n\\nUn appartement central pense pour une vie simple, pratique
        et immediate.\\n\\n### Une base confortable au coeur de la ville\\n\\nLa
        force du bien tient dans son equilibre. Les volumes sont lisibles, les
        circulations restent fluides et le balcon prolonge agreablement la piece
        de vie sans compliquer l'usage quotidien.\\n\\nAvec ses deux chambres et
        ses deux salles d'eau, l'appartement couvre facilement plusieurs
