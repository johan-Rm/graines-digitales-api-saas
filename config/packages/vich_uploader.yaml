vich_uploader:
    db_driver: orm
    metadata:
        type: attribute
    mappings:
        media_object:
            uri_prefix: /media
            upload_destination: '%env(WEBAPPS_DIR)%'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
            directory_namer: App\Uploader\ProjectDirectoryNamer
