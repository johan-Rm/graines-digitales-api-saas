api_platform:
    title: 'Graines Digitales Content Management API'
    version: '0.1.0'
    formats:
        jsonld: ['application/ld+json']
        json: ['application/json']
        multipart: ['multipart/form-data']
    defaults:
        stateless: true
        pagination_items_per_page: 30
        extra_properties:
            standard_put: true
            rfc_7807_compliant_errors: true
    swagger:
        api_keys:
            JWT:
                name: Authorization
                type: header
