parameters:
    platform_super_admin_emails: ''

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'

    App\State\ProjectCollectionProvider:
        arguments:
            $decorated: '@api_platform.doctrine.orm.state.collection_provider'

    App\State\ProjectScopedCollectionProvider:
        arguments:
            $decorated: '@api_platform.doctrine.orm.state.collection_provider'

    App\State\ProjectScopedItemProvider:
        arguments:
            $decorated: '@api_platform.doctrine.orm.state.item_provider'

    App\State\ProjectScopedPersistProcessor:
        arguments:
            $decorated: '@api_platform.doctrine.orm.state.persist_processor'

    App\State\CategoryCodePersistProcessor:
        arguments:
            $decorated: '@api_platform.doctrine.orm.state.persist_processor'

    App\State\CategoryCodeRemoveProcessor:
        arguments:
            $decorated: '@api_platform.doctrine.orm.state.remove_processor'

    App\State\ProjectPersistProcessor:
        arguments:
            $decorated: '@api_platform.doctrine.orm.state.persist_processor'

    App\State\ProjectScopedTranslationPersistProcessor:
        arguments:
            $decorated: '@api_platform.doctrine.orm.state.persist_processor'

    App\State\ProjectScopedRemoveProcessor:
        arguments:
            $decorated: '@api_platform.doctrine.orm.state.remove_processor'

    App\Security\PlatformSuperAdminResolver:
        arguments:
            $superAdminEmails: '%env(default:platform_super_admin_emails:PLATFORM_SUPER_ADMIN_EMAILS)%'
